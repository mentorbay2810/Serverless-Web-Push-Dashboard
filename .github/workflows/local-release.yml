name: Local release checks
on:
  push:
    branches: [main, 'SWPD/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: local-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    # Skip private repositories: the budget decision authorizes standard public runners only.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run setup
      - run: npm run validate:local
      - run: npm run research:smoke
      - run: npm run review:check
      - run: npm audit --audit-level=high
      # No deployment, cloud identity, caches, or artifact uploads.
  containers:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - run: docker compose build webpush
      - run: npm run container:smoke
  windows-targets:
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - run: npm ci
      - run: node --import tsx --test tests/azure-target.test.ts
      # Windows hosts run the app through Docker Desktop's Linux container backend.
